title: SECON
description: Archive of conferences on the economics of information security

# conferences/yml/<slug>.yml    -> site.data.yml.<slug>     (programma completo)
# conferences/papers/<slug>.yml -> site.data.papers.<slug>  (elenco paper, pagina principale)
data_dir: conferences

plugins:
  - jekyll-seo-tag

exclude:
  - pages-themes-cayman-56aa6db
  - _templates
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
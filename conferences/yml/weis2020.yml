              - name: "Mohammad Rahman"
                affiliation: "Purdue University"
              - name: "Tianjian Zhang"
                affiliation: "Oklahoma State University"

      - type: break
        title: "Virtual Coffee Break (randomly assigned breakout rooms)"
        time: "15:10-15:30 (UTC+1)"

      - type: session
        number: 2
        title: "Firms and Investments"
        time: "15:30-16:30 (UTC+1)"

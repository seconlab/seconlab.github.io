# All times are Brussels time (UTC+1), as stated on the agenda page.
# Each talk: 10 min + 5 min questions; each session ends with a 15-min plenary discussion.
program:
  - date: "2020-12-14"
    events:
      - type: opening
        title: "General Remarks"
        time: "14:00 (UTC+1)"

      - type: session
        number: 1
        title: "Vulnerabilities, Risks, and Breaches"
        time: "14:10-15:10 (UTC+1)"
        chair:
          name: "Bryan Routledge"
        papers:
          - title: "Prioritizing Vulnerability Response: a Stakeholder-Specific Vulnerability Categorization"
            time: "14:10"
            url: "https://weis2020.econinfosec.org/wp-content/uploads/sites/8/2020/06/weis20-final6.pdf"
            authors:
              - name: "Jonathan Spring"
                affiliation: "CERT/CC, Software Engineering Institute, Carnegie Mellon University"
              - name: "Allen Householder"
                affiliation: "CERT/CC, Software Engineering Institute, Carnegie Mellon University"
              - name: "Art Manion"
                affiliation: "CERT/CC, Software Engineering Institute, Carnegie Mellon University"
              - name: "Eric Hatleback"
                affiliation: "CERT/CC, Software Engineering Institute, Carnegie Mellon University"
              - name: "Deana Shick"
                affiliation: "Rockwell"
          - title: "Underlying and Consequential Costs of Cyber Security Breaches: Changes in Systematic Risk"
            time: "14:25"
            url: "https://weis2020.econinfosec.org/wp-content/uploads/sites/8/2020/06/weis20-final14.pdf"
            authors:
              - name: "Dennis D. Malliouris"
                affiliation: "University of Oxford"
              - name: "Andrew Simpson"
                affiliation: "University of Oxford"
          - title: "Cybersecurity Investments and the Cost of Capital"

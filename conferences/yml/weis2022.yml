          - name: "Laura Brandimarte"
            affiliation: "WEIS 2022 Program Chair"
          - name: "Sadia Afroz"
            affiliation: "WEIS 2022 Program Chair"
          - name: "Tyler Moore"
            affiliation: "WEIS 2022 General Chair"

      - type: session
        number: 1
        title: "Data Privacy Market"
        time: "09:00-10:30"
        venue: "Promenade D"
        papers:
          - title: "Exploring the role of data enclosure in the digital political economy"
            url: "https://weis2022.econinfosec.org/wp-content/uploads/sites/10/2022/06/weis22-kuerbis.pdf"
            authors:
              - name: "Brenden Kuerbis"
                affiliation: "Georgia Institute of Technology"
              - name: "Milton Mueller"
                affiliation: "Georgia Institute of Technology"
          - title: "Impact of App Privacy Label Disclosure on Demand: An Empirical Analysis"
            url: "https://weis2022.econinfosec.org/wp-content/uploads/sites/10/2022/06/weis22-telang.pdf"
            authors:
              - name: "Rahul Telang"
                affiliation: "Carnegie Mellon University"
              - name: "Rajiv Garg"
                affiliation: "Emory University"
          - title: "Prior Fraud Exposure and Precautionary Credit Market Behavior"
            url: "https://weis2022.econinfosec.org/wp-content/uploads/sites/10/2022/07/weis22-toh.pdf"
            authors:
              - name: "Ying Lei Toh"
                affiliation: "Federal Reserve Bank of Kansas City"
              - name: "Nathan Blascak"
                affiliation: "Federal Reserve Bank of Philadelphia"

      - type: break
        title: "Break"
        time: "10:30-11:00"
        venue: "Promenade Foyer / Williams Green"


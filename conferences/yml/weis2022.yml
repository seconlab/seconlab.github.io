            url: "https://weis2022.econinfosec.org/wp-content/uploads/sites/10/2022/06/weis22-sheneman.pdf"
            authors:
              - name: "Amy Sheneman"
                affiliation: "The Ohio State University"
          - title: "Empirically Evaluating the Effect of Cybersecurity Precautions on Incidents in Israeli Enterprises"
            url: "https://weis2022.econinfosec.org/wp-content/uploads/sites/10/2022/06/weis22-gandal.pdf"
            authors:
              - name: "Neil Gandal"
                affiliation: "Tel Aviv University and CEPR"
              - name: "Tyler Moore"
                affiliation: "University of Tulsa"
              - name: "Michael Riordan"
                affiliation: "Columbia University"
              - name: "Noa Barnir"
                affiliation: "Tel Aviv University"
          - title: "No research, no risk? An empirical study of determinants of information leakage attacks"
            url: "https://weis2022.econinfosec.org/wp-content/uploads/sites/10/2022/06/weis22-stupak.pdf"

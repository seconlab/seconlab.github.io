        title: "Keynote"
        time: "09:10-10:10"
        speaker:
          name: "Hal Varian"
          affiliation: "Chief Economist, Google"

      - type: break
        title: "Break"
        time: "10:10-10:30"

      - type: session
        number: 1
        title: "Security Investment"
        time: "10:30-12:10"
        chair:
          name: "Alessandro Acquisti"
          affiliation: "Carnegie Mellon University"
        papers:
          - title: "Whack-a-mole: Asymmetric Conflict and Guerrilla Warfare in Web Security"
            url: "https://weis2016.econinfosec.org/wp-content/uploads/sites/2/2016/05/WEIS_2016_paper_15-2.pdf"
            authors:
              - name: "Pern Hui Chia"
              - name: "John Chuang"
              - name: "Yanling Chen"
          - title: "Identifying How Firms Manage Cybersecurity Investment"
            url: "https://weis2016.econinfosec.org/wp-content/uploads/sites/2/2016/05/WEIS_2016_paper_19-1.pdf"
            authors:
              - name: "Tyler Moore"
              - name: "Scott Dynes"
              - name: "Frederick Chang"
          - title: "The Days Before Zero Day: Investment Models for Secure Software Engineering"
            url: "https://weis2016.econinfosec.org/wp-content/uploads/sites/2/2016/05/WEIS_2016_paper_21-2.pdf"
            authors:
              - name: "Chad Heitzenrater"
              - name: "Rainer Böhme"
              - name: "Andrew Simpson"
          - title: "Data Security in the Digital Age: Reputation and Strategic Interactions in Security Investment"
            url: "https://weis2016.econinfosec.org/wp-content/uploads/sites/2/2016/05/WEIS_2016_paper_34-4.pdf"
            authors:
              - name: "Ying Lei Toh"

      - type: break
        title: "Lunch — Richard Clayton presents a firsthand account and analysis of a recent hotel reservation scam"
        time: "12:10-13:00"
        speakers:
          - name: "Richard Clayton"
            affiliation: "University of Cambridge"

      - type: session
        number: 2
        title: "Online Payments"
        time: "13:00-14:40"
        chair:
          name: "John Chuang"
          affiliation: "University of California, Berkeley"
        papers:
          - title: "The Impact of DDoS and Other Security Shocks on Bitcoin Currency Exchanges: Evidence from Mt. Gox"
            url: "https://weis2016.econinfosec.org/wp-content/uploads/sites/2/2016/05/WEIS_2016_paper_7.pdf"
            authors:
              - name: "Neil Gandal"
              - name: "Tyler Moore"
              - name: "Amir Feder"
              - name: "James Hamrick"
          - title: "Determining an Optimal Threshold on the Online Reserves of a Bitcoin Exchange"
            url: "https://weis2016.econinfosec.org/wp-content/uploads/sites/2/2016/05/WEIS_2016_paper_68-2.pdf"
            authors:
              - name: "Samvit Jain"
              - name: "Edward Felten"
              - name: "Steven Goldfeder"
          - title: "Risk Management for Third Party Payment Networks"
            url: "https://weis2016.econinfosec.org/wp-content/uploads/sites/2/2016/05/WEIS_2016_paper_43-1.pdf"
            authors:
              - name: "Willem van Driel"
              - name: "Carlos Gañán"
              - name: "Maikel Lobbezoo"
              - name: "Michel van Eeten"
